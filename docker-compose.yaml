# ---------------------------------------------------------------------
# Airflow 3.x — STAMM minimal production-like stack
# - CeleryExecutor (Redis broker + Postgres result backend)
# - Custom image (airflow-custom:3.0.6) already contains your deps
# - .env file mounted and also loaded as env_file
# - stamm_net: shared network to reach the Model Registry API
# - ml_net:    external network created by the model-registry stack;
#              joined here so Airflow workers can reach stamm-postgres
# ---------------------------------------------------------------------

x-airflow-common: &airflow-common
  image: airflow-custom:3.0.6
  build:
    context: .
    dockerfile: Dockerfile

  # Load all shared environment variables (including PostgreSQL / model registry)
  env_file:
    - .env

  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

    # Database (Postgres) and Celery broker (Redis)
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-metadata-db/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@airflow-metadata-db/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0

    # Webserver base URL (adjust if you reverse-proxy or change port)
    AIRFLOW__WEBSERVER__BASE_URL: http://localhost:8080
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "False"
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"

    # Execusion API server
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-webserver:8080/execution/"

    # Timeouts/parallelism (reasonable defaults)
    AIRFLOW__CORE__PARALLELISM: "8"
    AIRFLOW__CORE__DAG_CONCURRENCY: "8"
    AIRFLOW__SCHEDULER__MAX_DAGRUNS_TO_CREATE_PER_LOOP: "16"
    AIRFLOW__SCHEDULER__MAX_THREADS: "4"

    # Logging lightweight defaults
    
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO

    # Ensure SQLAlchemy 2.0 engine behavior in Airflow 3
    AIRFLOW__DATABASE__LOAD_DEFAULT_CONNECTIONS: "False"

    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}

  volumes:
    # Mount local directories inside containers
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./init:/opt/airflow/init
    - ./.env:/opt/airflow/.env:ro

  # Attach all Airflow core services to:
  # - airflow_internal: internal network for Postgres / Redis / Flower
  # - stamm_net: shared network to talk to the Model Registry API
  # ml_net is NOT in this common block — only airflow-worker and
  # airflow-webserver join it explicitly, since those are the only two
  # services that actually need to reach (or be reached by) model-registry
  # directly. (Our own metadata DB is named "airflow-metadata-db" precisely
  # so it can't collide with model-registry's "postgres" service on ml_net —
  # see that service below — so this is a least-privilege choice now, not a
  # workaround for a naming collision.)
  networks:
    - airflow_internal
    - stamm_net

  # Backoff & restart policy appropriate for services
  restart: unless-stopped

# --------------------------- Core dependencies ------------------------

services:

  # --------------------------- PostgreSQL ---------------------------
  airflow-metadata-db:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airflow_internal
    restart: unless-stopped

  # --------------------------- Redis Broker --------------------------
  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airflow_internal
    restart: unless-stopped

  # --------------------------- Airflow Init --------------------------
  airflow-init:
    <<: *airflow-common
    command:
      - bash
      - -c
      - |
        set -euo pipefail

        echo "[bootstrap] Upgrading Airflow metadata database..."
        airflow db migrate || airflow db upgrade || true

        AIRFLOW_ADMIN_USER="${AIRFLOW_ADMIN_USER:-airflow}"
        AIRFLOW_ADMIN_PASSWORD="${AIRFLOW_ADMIN_PASSWORD:-airflow}"
        AIRFLOW_ADMIN_EMAIL="${AIRFLOW_ADMIN_EMAIL:-admin@stamm.local}"

        echo "[bootstrap] Checking if admin user '${AIRFLOW_ADMIN_USER}' exists..."
        if airflow users list 2>/dev/null | awk '{print $1}' | grep -qx "${AIRFLOW_ADMIN_USER}"; then
          echo "[bootstrap] Admin user '${AIRFLOW_ADMIN_USER}' already exists. Skipping creation."
        else
          echo "[bootstrap] Creating admin user '${AIRFLOW_ADMIN_USER}'..."
          airflow users create \
            --username "${AIRFLOW_ADMIN_USER}" \
            --password "${AIRFLOW_ADMIN_PASSWORD}" \
            --firstname "STAMM" \
            --lastname "Admin" \
            --role "Admin" \
            --email "${AIRFLOW_ADMIN_EMAIL}"
        fi

        echo "[bootstrap] Init completed successfully."
    depends_on:
      airflow-metadata-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"


  # --------------------------- Airflow API / UI (Airflow 3) ---------
  airflow-webserver:
    <<: *airflow-common
    command: ["api-server"]
    # Also on ml_net so model-registry-backend can reach it by container name
    # to trigger DAG runs (POST /auth/token, POST /api/v2/dags/.../dagRuns).
    # Safe to share ml_net here now that the metadata DB no longer collides
    # with model-registry's "postgres" service name (see airflow-metadata-db).
    networks:
      - airflow_internal
      - stamm_net
      - ml_net
    ports:
      # Host 8080 is already taken by model-registry-api on this box; only the
      # host-side mapping changes, containers still talk to airflow-webserver:8080.
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-metadata-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --------------------------- Airflow Scheduler ---------------------
  airflow-scheduler:
    <<: *airflow-common
    command: ["scheduler"]
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-metadata-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --------------------------- Airflow Triggerer ---------------------
  airflow-triggerer:
    <<: *airflow-common
    command: ["triggerer"]
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type TriggererJob --hostname $$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-metadata-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --------------------------- Airflow Worker ------------------------
  airflow-worker:
    <<: *airflow-common
    command: ["celery", "worker"]
    # Worker is the only service that executes DAG tasks, so it's the only one
    # that needs ml_net to reach stamm-postgres directly.
    networks:
      - airflow_internal
      - stamm_net
      - ml_net
    healthcheck:
      test: ["CMD-SHELL", "celery -A airflow.executors.celery_executor.app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-metadata-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # # --------------------------- Airflow REST API ----------------------
  # airflow-api:
  #   <<: *airflow-common
  #   command: ["apiserver"]
  #   ports:
  #     - "8081:8081"
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -f http://localhost:8081/health || exit 1"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #   depends_on:
  #     airflow-init:
  #       condition: service_completed_successfully
  #     airflow-metadata-db:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

# --------------------------- Flower Dashboard ----------------------
  flower:
    image: mher/flower:0.9.7
    command: ["flower", "--broker=redis://:@redis:6379/0", "--port=5555"]
    ports:
      - "5555:5555"
    networks:
      - airflow_internal
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      - redis
    restart: unless-stopped

  # --------------------------- Airflow DAG Processor ------------------
  airflow-dag-processor:
    <<: *airflow-common
    command: ["dag-processor"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-metadata-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

# --------------------------- Networks & volumes -----------------------

networks:
  airflow_internal:
    driver: bridge
  stamm_net:
    name: stamm_net
    driver: bridge
  ml_net:
    name: model-registry_ml_net   # Actual name created by model-registry compose stack
    external: true                # Will become "ml_net" after model-registry is redeployed

volumes:
  postgres-db-volume: