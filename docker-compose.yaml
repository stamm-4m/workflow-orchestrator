version: "3.9"

# ---------------------------------------------------------------------
# Airflow 3.x — STAMM minimal production-like stack
# - CeleryExecutor (Redis broker + Postgres result backend)
# - Custom image (airflow-custom:3.0.6) already contains your deps
# - .env file mounted and also loaded as env_file
# - External network to reach InfluxDB/Grafana if needed
# ---------------------------------------------------------------------

x-airflow-common: &airflow-common
  image: airflow-custom:3.0.6           
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - ./.env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

    # Database (Postgres) and Celery broker (Redis)
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0

    # Webserver base URL (adjust if you reverse-proxy or change port)
    AIRFLOW__WEBSERVER__BASE_URL: http://localhost:8080
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "False"
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"

    # Timeouts/parallelism (reasonable defaults)
    AIRFLOW__CORE__PARALLELISM: "8"
    AIRFLOW__CORE__DAG_CONCURRENCY: "8"
    AIRFLOW__SCHEDULER__MAX_DAGRUNS_TO_CREATE_PER_LOOP: "16"
    AIRFLOW__SCHEDULER__MAX_THREADS: "4"

    # Logging lightweight defaults
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO

    # Ensure SQLAlchemy 2.0 engine behavior in Airflow 3
    AIRFLOW__DATABASE__LOAD_DEFAULT_CONNECTIONS: "False"

    # Pass through your .env values to tasks (e.g., Influx & model registry)
    # (You already supply these via env_file ./.env)

  volumes:
    # Mount DAGs, logs, plugins; .env as read-only inside container
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./.env:/opt/airflow/.env:ro
  networks:
    - default
    - influx_external

  # Backoff & restart policy appropriate for services
  restart: unless-stopped

# --------------------------- Core dependencies ------------------------

services:

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot initialization: creates admin user, upgrades DB, etc.
  airflow-init:
    <<: *airflow-common
    entrypoint: ["/bin/bash", "-c"]
    command: >
      airflow db upgrade &&
      airflow users create
        --role Admin
        --username "$${AIRFLOW_DEFAULT_USER:-admin}"
        --password "$${AIRFLOW_DEFAULT_PASSWORD:-admin}"
        --firstname STAMM
        --lastname Admin
        --email admin@example.com || true
    depends_on:
      - postgres
      - redis
    restart: "no"

  # --------------------------- Airflow services -----------------------

  airflow-webserver:
    <<: *airflow-common
    command: ["webserver"]
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  airflow-scheduler:
    <<: *airflow-common
    command: ["scheduler"]
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  airflow-triggerer:
    <<: *airflow-common
    command: ["triggerer"]
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type TriggererJob --hostname $$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  airflow-worker:
    <<: *airflow-common
    command: ["celery", "worker"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A airflow.executors.celery_executor.app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  airflow-api:
    <<: *airflow-common
    command: ["standalone_api"]
    ports:
      - "8081:8081"   # Airflow REST API (adjust if needed)
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  flower:
    image: mher/flower:2.0.1
    command: ["flower", "--broker=redis://:@redis:6379/0", "--port=5555"]
    ports:
      - "5555:5555"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      - redis
    restart: unless-stopped

# --------------------------- Networks & volumes -----------------------

networks:
  influx_external:
    external: true
    name: influxdb_default  # ensure this external network exists (docker network ls)

volumes:
  postgres-db-volume: